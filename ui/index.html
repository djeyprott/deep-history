<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deep History — a human history simulator</title>
<style>/*CSS*/</style></head>
<body><div id="app">
<div id="top"><h1>Deep <span>History</span></h1>
 <div id="year">—</div><div id="era"></div>
 <div class="grp"><button id="play">▶ Play</button><button id="step">+1 yr</button><button id="step100">+100 yrs</button>
  <select id="speed"><option value="1">1 yr/s</option><option value="5" selected>5 yrs/s</option><option value="20">20 yrs/s</option><option value="60">60 yrs/s</option><option value="999">Max</option></select></div>
 <div class="grp" style="margin-left:auto"><button id="new">New world…</button></div></div>
<div id="main"><div id="mapwrap"><canvas id="map"></canvas><div id="modes"></div><div id="legend"></div><div id="hover"></div>
 <div id="loading" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,.5);color:#fff;display:none;align-items:center;justify-content:center;font-size:16px;z-index:5;padding-top:40vh;text-align:center">Shaping the world…</div></div>
 <div id="side"><div id="tabs"></div><div id="pane"></div></div></div>
<div id="bottom"></div></div>
<div id="dlg"><div class="box"><h2>Begin a history</h2>
 <div class="muted">History starts in 15,000 BCE with Late Stone Age foragers. Everything after — farming, cities, states, faiths, tongues — must emerge.</div>
 <label>World</label><select id="wkind" style="width:100%"><option value="earth">Earth (approximate geography, real orbital timing)</option><option value="proc">Generated world (new continents each seed)</option></select>
 <label>Seed</label><input id="wseed" type="number" value="1" style="width:100%">
 <div style="margin-top:14px;display:flex;justify-content:flex-end"><button id="go" class="on">Begin</button></div></div></div>
<script>/*JS*/</script></body></html>
