name: Build executables
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Standalone HTML
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: cp dist/index.html release/DeepHistory.html
      - uses: actions/upload-artifact@v4
        with:
          name: deep-history-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/DeepHistory.html
          if-no-files-found: ignore
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Deep History v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Desktop builds of Deep History. Windows: the portable .exe runs without installing. macOS: right-click the app → Open the first time (unsigned). Linux: chmod +x the AppImage. Or open DeepHistory.html in any browser.
          files: out/*
